spring:
  application:
    name: demoapplication

  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: demo
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB